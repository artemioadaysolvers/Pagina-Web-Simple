
name: Probar y desplegar calculadora Docker en Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: registrocalculadora2026
  ACR_LOGIN_SERVER: registrocalculadora2026.azurecr.io
  IMAGE_NAME: paginacalculadora
  AZURE_WEBAPP_NAME: paginacalculadora-docker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener archivos de GitHub
        uses: actions/checkout@v4

      - name: Autenticarse en Azure mediante OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3681E5F1E589498D81160EF11062609B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CAD55F467C9F497F88AF8D19DCE438AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_74E9D5C7D2AB4D5790F5183E01E7B84E }}

      - name: Autenticarse en Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Construir imagen Docker con Python 3.14.8
        run: |
          docker build --pull \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" \
            .

      - name: Verificar version de Python dentro de Docker
        run: |
          docker run --rm \
            --entrypoint python \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" \
            --version

      - name: Ejecutar pruebas dentro de Docker
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/tests" \
            --workdir /tests \
            --entrypoint python \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA" \
            -m unittest discover -v

      - name: Publicar imagen en Azure Container Registry
        run: docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"

      - name: Desplegar contenedor en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
