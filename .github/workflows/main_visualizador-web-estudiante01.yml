name: Publicar sitio estatico en Azure - visualizador-web-estudiante01

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-visualizador-web-estudiante01
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar carpeta site
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Comprobar archivos del sitio
        run: |
          test -f site/index.html
          test -f site/assets/styles.css
          test -f site/viewers/AutoMind_MJCF_Modular_Viewer_1.html
          test -f site/viewers/AutoMind_MJCF_Modular_Viewer_2.html

      # Mantener los nombres de los secretos generados en Azure para esta aplicacion.
      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8C3A1775AB8048FEA2DAB6F7FBF0B853 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_742062C05F3C48D0BB2A080BF0C407EA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D0D65476AAC945C49ED342E3BB303790 }}

      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: visualizador-web-estudiante01
          slot-name: Production
          package: site
